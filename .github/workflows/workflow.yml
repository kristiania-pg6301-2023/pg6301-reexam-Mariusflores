name: Run Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install

      - name: Build
        run: npm run build

      - name: Run tests
        env:
          MONGODB_URL: ${{secrets.MONGODB_URL}}
          SESSION_SECRET: ${{secrets.SESSION_SECRET}}
          GOOGLE_CLIENT_ID: ${{secrets.GOOGLE_CLIENT_ID}}
          GOOGLE_CLIENT_SECRET: ${{secrets.GOOGLE_CLIENT_SECRET}}
          GOOGLE_CALLBACK_URL: ${{secrets.GOOGLE_CALLBACK_URL}}
          GITHUB_CLIENT_ID: ${{secrets.GITHUBAUTH_CLIENT_ID}}
          GITHUB_CLIENT_SECRET: ${{secrets.GITHUBAUTH_CLIENT_SECRET}}
          GITHUB_CALLBACK_URL: ${{secrets.GITHUBAUTH_CALLBACK_URL}}
        run: npm run test
deploy:
  name: Deploy to Heroku
  needs: test
  runs-on: ubuntu-latest
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Heroku CLI
      run: |
        curl https://cli-assets.heroku.com/install.sh | sh

    - name: Authenticate with Heroku
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      run: |
        echo "machine api.heroku.com login=api_key password=$HEROKU_API_KEY" > ~/.netrc
        echo "machine git.heroku.com login=api_key password=$HEROKU_API_KEY" >> ~/.netrc
        chmod 600 ~/.netrc

    - name: Add Heroku Git Remote
      env:
        HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
      run: |
        heroku git:remote -a $HEROKU_APP_NAME

    - name: Push Code to Heroku
      run: |
        git push heroku main
